name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read
  deployments: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build Pages artifact
        run: npm run build
        env:
          VITE_BASE_PATH: /planning/

      - name: Verify Pages artifact
        run: npm run verify:pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Same artifact client as actions/deploy-pages (REST artifact ids are not accepted).
      - name: Install deploy helpers
        run: npm install --no-save @actions/artifact@2.3.2

      - name: Cancel stale Pages deployments
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/deploy-pages-robust.mjs --cancel-stale-only

      - name: Deploy Pages (long poll, no cancel-on-timeout)
        id: deployment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_DEPLOY_TIMEOUT_MS: "1500000"
          PAGES_DEPLOY_POLL_MS: "10000"
        run: node scripts/deploy-pages-robust.mjs
